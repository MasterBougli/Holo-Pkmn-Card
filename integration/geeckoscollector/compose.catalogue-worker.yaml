services:
  catalogue-worker:
    image: geeckoscollector-catalogue-worker:1.0.1
    container_name: geeckoscollector-catalogue-worker
    restart: unless-stopped
    init: true
    user: "1000:1000"
    working_dir: /workspace
    read_only: true
    env_file:
      - /home/codex/.geeckoscollector-worker/worker.env
    volumes:
      - /home/codex/GeeckosCollector:/workspace:ro
      - /home/codex/GeeckosCollector/Web/Cards:/workspace/Web/Cards:rw
    tmpfs:
      - /tmp:size=256m,mode=1777
    shm_size: 128m
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 0.75
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
      - seccomp=/home/codex/GeeckosCollector/infrastructure/catalogue-worker/seccomp.json
    networks:
      - catalogue-database
networks:
  catalogue-database:
    external: true
    name: geeckoscollector_default
